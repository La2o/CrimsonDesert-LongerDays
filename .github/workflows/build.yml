name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package/bin64 | Out-Null
          Copy-Item build/Release/CrimsonDesertLongerDays.asi package/bin64/
          Copy-Item CrimsonDesertLongerDays.ini package/bin64/
          Copy-Item README.md package/

      - uses: actions/upload-artifact@v4
        with:
          name: CrimsonDesertLongerDays
          path: package/
