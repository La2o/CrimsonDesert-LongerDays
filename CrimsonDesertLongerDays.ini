; Crimson Desert - Longer Days
; Save this file while the game is running: changes apply within a second.
; The log (CrimsonDesertLongerDays.log) prints one line per in-game hour
; showing exactly how much the clock is being slowed and why.

[LongerDays]
; 1 = on, 0 = off (vanilla day/night speed).
Enabled=1

; How many times longer daytime lasts. 2.0 = days twice as long, 1.0 = vanilla,
; 0.5 = half as long. Range 0.1 - 20.
DayLengthMultiplier=2.0

; Same for night. Raise it too to slow the whole cycle; below 1.0 makes nights
; pass faster.
NightLengthMultiplier=1.0

; In-game hours (0-24, decimals allowed) that count as day. A window that wraps
; midnight (e.g. 22 -> 4) also works.
DayStartHour=6.0
DayEndHour=20.0

; Hours over which the speed eases from night to day and back, centred on
; DayStartHour / DayEndHour. 0 = switch instantly.
TransitionHours=1.0

; 1 = keep the sun, moon and sky in step with the slowed clock.
; 0 = only slow the numeric clock (the sky then keeps vanilla speed).
SyncSun=1

; Virtual-key code that toggles the mod in-game (0 = no hotkey). 0x77 = F8.
; https://learn.microsoft.com/windows/win32/inputdev/virtual-key-codes
ToggleKey=0x77

; 1 = briefly show "Longer Days: ON/OFF" near the top of the screen when the
; hotkey is pressed. Shows in borderless and windowed mode; in exclusive
; fullscreen you only hear the sound. 0 = sound only.
ShowToast=1

; Hold this key to fast-forward time (0 = no key). 0x76 = F7. Handy for
; watching a whole sunset in seconds, or checking that the sky follows the
; clock. Works whether the mod is on or off; release it to go back.
FastForwardKey=0x76
; How many times faster time runs while the key is held. Range 2 - 200.
FastForwardSpeed=30

[GoldenHour]
; Sunrise and sunset linger: time slows by this extra factor at the exact
; moment of sunrise/sunset, easing off on either side. 1.0 = off.
Multiplier=1.5
; Total width of each golden hour window, in in-game hours.
LengthHours=1.0

[RealTime]
; Set how long day or night lasts in REAL minutes instead of a multiplier.
; 0 = use the multipliers above. The mod measures the game's own clock speed
; in the first minute or two of play, so these stay accurate after patches.
; Example: DayRealMinutes=90 -> 06:00-20:00 takes about an hour and a half
; (golden hour, if on, adds a little on top).
DayRealMinutes=0
NightRealMinutes=0

[Seasons]
; Daytime length rises and falls over an in-game year: long summer days, short
; winter days. Strength 0.3 = summer days 30% longer, winter days 30% shorter
; than DayLengthMultiplier. 0 = off. Nights are not affected.
Strength=0.0
; In-game days per year, and the day of peak summer.
; 120 / 15 roughly lines up with Seasons of Pywel (30-day seasons, summer first).
YearLengthDays=120
SummerPeakDay=15
