; Crimson Desert - Longer Days
; Save this file while the game is running: changes apply within a second.

[LongerDays]
; 1 = on, 0 = off (vanilla day/night speed).
Enabled=1

; How many times longer daytime lasts. 2.0 = days twice as long, 3.0 = three
; times, 1.0 = vanilla, 0.5 = half as long. Range 0.1 - 20.
DayLengthMultiplier=2.0

; Same for night. Keep at 1.0 for vanilla nights, or raise it too if you want
; the whole cycle slower. Below 1.0 makes nights pass faster.
NightLengthMultiplier=1.0

; In-game hours (0-24, decimals allowed) that count as "day" for the
; multipliers above. A window that wraps midnight (e.g. 22 -> 4) also works.
DayStartHour=6.0
DayEndHour=20.0

; 1 = keep the sun, moon and sky in step with the slowed clock.
; 0 = only slow the numeric clock (the sky then keeps vanilla speed).
SyncSun=1

; Virtual-key code that toggles the mod in-game (0 = no hotkey).
; 0x77 = F8. Full list: https://learn.microsoft.com/windows/win32/inputdev/virtual-key-codes
ToggleKey=0x77
